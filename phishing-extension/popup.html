<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phishing Detector</title>
<link href="popup.css" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <span class="mark">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z"/>
      <path d="m8.5 12 2.5 2.5L16 9.5"/>
    </svg>
  </span>
  <span class="topbar-title">Phishing Detector</span>
  <span class="engine" id="engine-badge">Rules only</span>
</header>

<main>
  <p class="current-url" id="current-url">Loading current tab…</p>

  <button type="button" id="check-btn">Check this page</button>

  <section id="result" class="result" hidden>
    <div class="verdict">
      <span class="verdict-label" id="verdict-label"></span>
      <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
      <p class="meter-caption">Risk score <strong id="score-value">0</strong>/100</p>
    </div>

    <ul class="findings" id="findings"></ul>

    <div class="ai-block" id="ai-block" hidden>
      <p class="ai-heading">AI review</p>
      <p class="ai-verdict" id="ai-verdict"></p>
      <p class="ai-explanation" id="ai-explanation"></p>
    </div>
  </section>

  <p class="error" id="error" hidden></p>

  <p class="footnote">
    Checks the URL's structure only — it never opens or downloads the page.
  </p>
</main>

<script src="rules.js"></script>
<script src="popup.js"></script>
</body>
</html>
