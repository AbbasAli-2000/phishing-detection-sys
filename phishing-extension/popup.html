<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phishing Detector</title>
<link href="popup.css" rel="stylesheet">
</head>
<body>
<main>
  <header>
    <span class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z"/><path d="m8.5 12 2.5 2.5L16 9.5"/>
      </svg>
    </span>
    <h1>Phishing Detector</h1>
    <span id="mode" class="mode">Local rules</span>
  </header>

  <p id="current" class="current">Loading current tab…</p>
  <button id="btn" type="button">Check this page</button>
  <p id="error" class="error" hidden></p>

  <section id="result" hidden>
    <div class="verdict">
      <span class="icon" id="icon"></span>
      <div>
        <strong id="label"></strong>
        <span id="sub"></span>
      </div>
    </div>
    <ul id="findings"></ul>
    <div class="chips">
      <span id="domain"></span>
      <span id="https"></span>
    </div>
    <p id="ai" class="ai" hidden></p>
  </section>
</main>
<script src="rules.js"></script>
<script src="popup.js"></script>
</body>
</html>
