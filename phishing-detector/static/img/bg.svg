<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Blur & Glow Filters -->
    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur stdDeviation="18" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glass Drop Shadow -->
    <filter id="glass-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38BDF8" flood-opacity="0.2"/>
    </filter>

    <!-- Pure Frosted Glass Surface Gradient -->
    <linearGradient id="pure-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Glass Border Highlight (Light Reflection Rim) -->
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glass Surface Specular Sheen -->
    <linearGradient id="glass-sheen" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="sphere-core" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#030712" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1600" height="900" fill="#030712"/>

  <!-- High-Tech Ambient Glowing Lights (Behind Glass) -->
  <g filter="url(#ambient-blur)">
    <circle cx="260" cy="200" r="360" fill="#6366F1" fill-opacity="0.45"/>
    <circle cx="1350" cy="650" r="440" fill="#0284C7" fill-opacity="0.5"/>
    <circle cx="1450" cy="180" r="320" fill="#EC4899" fill-opacity="0.28"/>
    <circle cx="700" cy="900" r="380" fill="#3B82F6" fill-opacity="0.25"/>
  </g>

  <!-- Cyber Perspective Floor Grid -->
  <g opacity="0.25">
    <line x1="800" y1="550" x2="-200" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="800" y1="550" x2="200" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="800" y1="550" x2="550" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="800" y1="550" x2="1050" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="800" y1="550" x2="1400" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="800" y1="550" x2="1800" y2="920" stroke="#38BDF8" stroke-width="1.2"/>
    <path d="M150 630 H1450 M50 710 H1550 M-50 810 H1650" stroke="#818CF8" stroke-width="1.2"/>
  </g>

  <!-- Dynamic Cyber Beams -->
  <g stroke="url(#laser-beam)" stroke-width="1.8">
    <path d="M-100 820 L1100 120" opacity="0.6"/>
    <path d="M260 960 L1580 180" opacity="0.5"/>
    <path d="M680 950 L1750 340" opacity="0.4"/>
  </g>

  <!-- ============================================== -->
  <!-- 3D HIGH-TECH WIREFRAME GLOBE (RIGHT SIDE)       -->
  <!-- ============================================== -->
  <g transform="translate(1280, 620)">
    <circle r="360" fill="url(#sphere-core)"/>
    <circle r="360" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Concentric Target Circles -->
    <circle r="395" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="8 12"/>
    <circle r="435" fill="none" stroke="#818CF8" stroke-opacity="0.2" stroke-width="1.2"/>
    <circle r="450" fill="none" stroke="#C084FC" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 24 16 12"/>

    <!-- Wireframe Mesh -->
    <g fill="none" stroke="url(#neon-cyan-purple)" stroke-opacity="0.45" stroke-width="1.2">
      <ellipse rx="360" ry="70" cy="-240"/>
      <ellipse rx="360" ry="130" cy="-130"/>
      <ellipse rx="360" ry="160" cy="0"/>
      <ellipse rx="360" ry="130" cy="130"/>
      <ellipse rx="360" ry="70" cy="240"/>
      <ellipse rx="120" ry="360"/>
      <ellipse rx="240" ry="360"/>
      <line x1="-360" y1="0" x2="360" y2="0" stroke-dasharray="6 6"/>
      <line x1="0" y1="-360" x2="0" y2="360" stroke-dasharray="6 6"/>
    </g>

    <!-- Outer Tilted Cyber Orbit Ring -->
    <g transform="rotate(-28)">
      <ellipse rx="520" ry="145" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="2.2" stroke-opacity="0.85" filter="url(#glow-soft)"/>
      <ellipse rx="520" ry="145" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="14 18 4 18"/>
      
      <!-- Primary Satellite Node -->
      <g transform="translate(520, 0)">
        <circle r="20" fill="#EC4899" fill-opacity="0.25" filter="url(#glow-strong)"/>
        <circle r="9" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2.5"/>
        <circle r="30" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.6"/>
      </g>
      <!-- Secondary Node -->
      <g transform="translate(-480, -56)">
        <circle r="7" fill="#00F2FE" stroke="#FFFFFF" stroke-width="2"/>
        <circle r="18" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.5"/>
      </g>
    </g>

    <!-- Anamorphic Light Flare Accent -->
    <ellipse cx="0" cy="0" rx="380" ry="1.5" fill="#38BDF8" filter="url(#glow-strong)" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="160" ry="3.5" fill="#FFFFFF" filter="url(#glow-soft)" opacity="0.8"/>
  </g>

  <!-- ============================================== -->
  <!-- GLASS TILE 1: PURE FROSTED GLASS LOCK (TOP LEFT) -->
  <!-- ============================================== -->
  <g transform="translate(190, 120) rotate(-6)" filter="url(#glass-shadow)">
    <!-- Main Glass Body -->
    <rect width="210" height="210" rx="38" fill="url(#pure-glass)"/>
    <!-- Specular Light Sheen (Top Half Reflection) -->
    <path d="M 38 1 H 172 A 37 37 0 0 1 209 38 V 100 L 1 140 V 38 A 37 37 0 0 1 38 1 Z" fill="url(#glass-sheen)"/>
    <!-- Crisp Outer Glass Border -->
    <rect width="210" height="210" rx="38" fill="none" stroke="url(#glass-rim)" stroke-width="2"/>

    <!-- Subtle Inside Aura -->
    <circle cx="105" cy="105" r="48" fill="#818CF8" fill-opacity="0.22" filter="url(#glow-soft)"/>

    <!-- Centered Minimal Glowing Lock Icon -->
    <g transform="translate(68, 62)">
      <!-- Lock Shackle -->
      <path d="M22 36 V 21 A 15 15 0 0 1 52 21 V 36" fill="none" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Lock Body -->
      <rect x="10" y="36" width="54" height="44" rx="14" fill="#0F172A" fill-opacity="0.75" stroke="url(#neon-cyan-purple)" stroke-width="2.5"/>
      <!-- Keyhole -->
      <circle cx="37" cy="54" r="4.5" fill="#38BDF8" filter="url(#glow-strong)"/>
      <path d="M35.5 57 L34 66 H40 L38.5 57 Z" fill="#38BDF8"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- GLASS TILE 2: PURE FROSTED GLASS SHIELD (BOTTOM) -->
  <!-- ============================================== -->
  <g transform="translate(380, 560) rotate(8)" filter="url(#glass-shadow)">
    <!-- Main Glass Body -->
    <rect width="190" height="190" rx="34" fill="url(#pure-glass)"/>
    <!-- Specular Light Sheen -->
    <path d="M 34 1 H 156 A 33 33 0 0 1 189 34 V 90 L 1 130 V 34 A 33 33 0 0 1 34 1 Z" fill="url(#glass-sheen)"/>
    <!-- Glass Border -->
    <rect width="190" height="190" rx="34" fill="none" stroke="url(#glass-rim)" stroke-width="1.8"/>

    <!-- Ambient Aura -->
    <circle cx="95" cy="95" r="45" fill="#38BDF8" fill-opacity="0.2" filter="url(#glow-soft)"/>

    <!-- Centered Modern Shield Icon -->
    <g transform="translate(60, 52)">
      <path d="M35 6 L8 18 V 38 C 8 58 19 75 35 82 C 51 75 62 58 62 38 V 18 Z" 
            fill="#0F172A" fill-opacity="0.7" 
            stroke="url(#neon-cyan-purple)" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Neon Checkmark -->
      <path d="M23 42 L31 50 L47 32" fill="none" stroke="#00F2FE" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-soft)"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING GLASS ACCENTS & CHIPS                 -->
  <!-- ============================================== -->
  <!-- Top Right Glass Token -->
  <g transform="translate(1080, 100) rotate(22)" filter="url(#glass-shadow)">
    <rect width="84" height="84" rx="24" fill="url(#pure-glass)" stroke="url(#glass-rim)" stroke-width="1.6"/>
    <!-- Core Target Symbol -->
    <rect x="28" y="28" width="28" height="28" rx="8" fill="#6366F1" fill-opacity="0.25" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="42" cy="42" r="3.5" fill="#00F2FE" filter="url(#glow-strong)"/>
    <line x1="42" y1="18" x2="42" y2="28" stroke="#38BDF8" stroke-width="1.6"/>
    <line x1="42" y1="56" x2="42" y2="66" stroke="#38BDF8" stroke-width="1.6"/>
    <line x1="18" y1="42" x2="28" y2="42" stroke="#38BDF8" stroke-width="1.6"/>
    <line x1="56" y1="42" x2="66" y2="42" stroke="#38BDF8" stroke-width="1.6"/>
  </g>

  <!-- Small Plus Tile (Far Left) -->
  <g transform="translate(90, 540) rotate(16)" filter="url(#glass-shadow)">
    <rect width="64" height="64" rx="18" fill="url(#pure-glass)" stroke="url(#glass-rim)" stroke-width="1.4"/>
    <path d="M22 32 H42 M32 22 V42" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Small Diamond Accent (Bottom) -->
  <g transform="translate(730, 770) rotate(-16)" filter="url(#glass-shadow)">
    <rect width="60" height="60" rx="18" fill="url(#pure-glass)" stroke="url(#glass-rim)" stroke-width="1.4"/>
    <circle cx="30" cy="30" r="4" fill="#EC4899" filter="url(#glow-strong)"/>
  </g>

  <!-- ============================================== -->
  <!-- 4-POINT STARS & CONSTELLATION NODES            -->
  <!-- ============================================== -->
  <!-- Sparkles -->
  <g transform="translate(980, 240) scale(1.3)" filter="url(#glow-soft)">
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FFFFFF"/>
  </g>
  <g transform="translate(380, 80) scale(0.9)" filter="url(#glow-soft)">
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#38BDF8"/>
  </g>
  <g transform="translate(1520, 480) scale(1.1)" filter="url(#glow-soft)">
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="#FFFFFF"/>
  </g>

  <!-- Ambient Light Dust Nodes -->
  <g fill="#FFFFFF">
    <circle cx="480" cy="220" r="1.5" opacity="0.6"/>
    <circle cx="620" cy="160" r="2" opacity="0.7"/>
    <circle cx="890" cy="190" r="2.2" opacity="0.8"/>
    <circle cx="1140" cy="310" r="2.5" fill="#38BDF8" opacity="0.9"/>
    <circle cx="180" cy="400" r="1.8" opacity="0.5"/>
  </g>

  <!-- Network Dashed Lines -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 5">
    <line x1="620" y1="160" x2="890" y2="190"/>
    <line x1="890" y1="190" x2="980" y2="240"/>
  </g>
</svg>